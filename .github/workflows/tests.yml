name: tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

# Cancel in-progress runs for the same ref when a new commit lands.
concurrency:
    group: tests-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        name: pnpm run verify (typecheck · lint · test · build)
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0 # full history; some tests inspect the commit graph

            - name: Set up pnpm
              uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
              # version comes from package.json packageManager (pnpm@11.9.0)

            - name: Set up Node
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 22 # matches package.json engines (node >=22)
                  cache: pnpm

            - name: Configure git identity for tests
              # Hook tests (branch-protection, secret-guard, the TDD commit-order gate)
              # create commits inside tmpdir git repos; CI runners ship without a git
              # identity, so `git commit` would abort with exit 128.
              run: |
                  git config --global user.email "tests@factory.ci"
                  git config --global user.name "factory-tests"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Version parity (package.json ≡ plugin.json ≡ marketplace.json)
              run: pnpm run version:check

            - name: Verify (typecheck · lint · test · build)
              run: pnpm run verify

            - name: Coverage (ratchet thresholds from vitest.config.ts)
              run: pnpm exec vitest run --coverage

            - name: Assert committed bundles match a fresh build (semgrep scans src, ships dist)
              # .semgrepignore excludes dist/, but dist/factory.js + dist/factory-hook.js are
              # the SHIPPED executables (package.json bin), deterministically rebuilt from the
              # scanned src/ by scripts/build.mjs. Proving committed == build(src) makes scanning
              # src equivalent to scanning the artifact. Fails loud if a bundle drifted from source.
              run: |
                  pnpm run build
                  git diff --exit-code -- dist/ templates/.github/scripts/shard-mutation-scope.mjs

    semgrep:
        name: semgrep SAST (authored src, .semgrepignore scoped)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Semgrep SAST
              uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
              with:
                  config: >-
                      p/typescript
                      p/security-audit
                      p/secrets
